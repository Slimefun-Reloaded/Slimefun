# Name and version
name: Slimefun
version: ${project.version}

# Project metadata
author: The Slimefun 4 Community
website: https://github.com/Slimefun
description: 无需安装模组，即可将整个服务器变成类似 FTB 的模组整合包体验

# Technical settings
main: io.github.thebusybiscuit.slimefun4.implementation.Slimefun
api-version: '26.1.2'
folia-supported: true

# (Soft) dependencies of Slimefun, we hook into these plugins.
softdepend:
- PlaceholderAPI
- WorldEdit
- ClearLag
- mcMMO
- ItemsAdder
- Orebfuscator

# 插件命令
commands:
  slimefun:
    aliases: sf
    description: Slimefun 主命令
    usage: 当前 Slimefun 版本似乎与服务器环境不兼容，请查看控制台了解详情。

# 默认权限
permissions:
  slimefun.command.guide:
    description: 允许获取 Slimefun 指南
    default: true
  slimefun.command.search:
    description: 允许使用 /sf search 搜索指南
    default: true
  slimefun.command.open_guide:
    description: 允许不使用指南物品直接打开指南
    default: op
  slimefun.cheat.items:
    description: 允许通过作弊模式获取物品
    default: op
  slimefun.cheat.researches:
    description: 允许通过作弊模式解锁研究
    default: op
  slimefun.stats.others:
    description: 允许查看其他玩家的统计数据
    default: op
  slimefun.android.upload-script:
    description: 允许上传机器人脚本
    default: op
  slimefun.command.timings:
    description: 允许使用 /sf timings 查看性能报告
    default: op
  slimefun.command.teleporter:
    description: 允许使用 /sf teleporter 查看传送点
    default: op
  slimefun.command.versions:
    description: 允许使用 /sf versions 查看版本信息
    default: op
  slimefun.command.backpack:
    description: 允许使用 /sf backpack 管理背包
    default: op
  slimefun.command.charge:
    description: 允许使用 /sf charge 为物品充电
    default: op
  slimefun.command.debug:
    description: 允许使用 /sf debug 调试 Slimefun
    default: op
  slimefun.android.bypass:
    description: 允许编辑其他玩家的机器人
    default: op
  slimefun.cargo.bypass:
    description: 允许编辑其他玩家的货运方块
    default: op
  slimefun.inventory.bypass:
    description: 允许打开所有 Slimefun 机器
    default: op
  slimefun.gps.bypass:
    description: 允许打开所有 GPS 容器
    default: op
  slimefun.debugging:
    description: 允许使用 Slimefun 调试工具
    default: op
