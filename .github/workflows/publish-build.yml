name: Publish build

on:
  push:
    branches:
      - master
      - stable
      - experimental

permissions:
  contents: read

jobs:
  publish:
    name: Upload build
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[ci skip]') == false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4.6.0
        with:
          distribution: 'temurin'
          java-version: '25'
          java-package: jdk
          architecture: x64

      - name: Build with Maven
        run: mvn clean package

      - name: Verify build artifact
        run: |
          set -euo pipefail

          JAR_FILE='./target/Slimefun v4.9-UNOFFICIAL.jar'

          if [ ! -f "$JAR_FILE" ]; then
            echo "Build did not produce $JAR_FILE" >&2
            find ./target -maxdepth 1 -type f -print >&2
            exit 1
          fi

          unzip -t "$JAR_FILE" > /dev/null

      - name: Upload GitHub build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slimefun-${{ github.ref_name }}-${{ github.sha }}
          path: './target/Slimefun v4.9-UNOFFICIAL.jar'
          if-no-files-found: error
          retention-days: 14

      - name: Check blob.build token
        env:
          BLOB_BUILDS_API_TOKEN: ${{ secrets.BLOB_BUILDS_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$BLOB_BUILDS_API_TOKEN" ]; then
            echo "HAS_BLOB_BUILDS_TOKEN=false" >> "$GITHUB_ENV"
            echo "::notice::BLOB_BUILDS_API_TOKEN is not configured; skipping blob.build upload"
          else
            echo "HAS_BLOB_BUILDS_TOKEN=true" >> "$GITHUB_ENV"
          fi

      - name: Upload Dev build
        uses: WalshyDev/blob-builds/gh-action@ea9ecd9266c902c6627f884e657560d0fa6b61dd
        if: github.ref == 'refs/heads/master' && env.HAS_BLOB_BUILDS_TOKEN == 'true'
        with:
          project: Slimefun4
          releaseChannel: Dev
          apiToken: ${{ secrets.BLOB_BUILDS_API_TOKEN }}
          file: './target/Slimefun v4.9-UNOFFICIAL.jar'
          releaseNotes: ${{ github.event.head_commit.message }}

      - name: Upload RC build
        uses: WalshyDev/blob-builds/gh-action@ea9ecd9266c902c6627f884e657560d0fa6b61dd
        if: github.ref == 'refs/heads/stable' && env.HAS_BLOB_BUILDS_TOKEN == 'true'
        with:
          project: Slimefun4
          releaseChannel: 'RC'
          apiToken: ${{ secrets.BLOB_BUILDS_API_TOKEN }}
          file: './target/Slimefun v4.9-UNOFFICIAL.jar'
          releaseNotes: ${{ github.event.head_commit.message }}

      - name: Upload Experimental build
        uses: WalshyDev/blob-builds/gh-action@ea9ecd9266c902c6627f884e657560d0fa6b61dd
        if: github.ref == 'refs/heads/experimental' && env.HAS_BLOB_BUILDS_TOKEN == 'true'
        with:
          project: Slimefun4
          releaseChannel: 'Experimental'
          apiToken: ${{ secrets.BLOB_BUILDS_API_TOKEN }}
          file: './target/Slimefun v4.9-UNOFFICIAL.jar'
          releaseNotes: ${{ github.event.head_commit.message }}
