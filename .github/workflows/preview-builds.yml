name: Preview builds

on:
  workflow_run:
    workflows: ["Pull Request"]
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  preview:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    name: Publish preview jar
    runs-on: ubuntu-latest

    steps:
      - name: Grab PR metadata and download the artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });

            for (const artifact of allArtifacts.data.artifacts) {
              // Extract the PR number and commit hash from the artifact name
              const match = /^slimefun-(\d+)-([a-f0-9]{8})$/.exec(artifact.name);
              if (match) {
                fs.appendFileSync(
                  process.env.GITHUB_ENV,
                  `\nPR_NUMBER=${match[1]}` +
                    `\nCOMMIT_HASH=${match[2]}`
                );

                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/preview.zip`, Buffer.from(download.data));

                break;
              }
            }

            if (!fs.existsSync(`${process.env.GITHUB_WORKSPACE}/preview.zip`)) {
              core.notice(`No Slimefun preview artifact found on workflow run ${context.payload.workflow_run.id}; skipping preview publish`);
              fs.appendFileSync(process.env.GITHUB_ENV, "\nSKIP_PREVIEW=true");
            }

      # Unzip the artifact
      - name: Unzip
        if: ${{ env.SKIP_PREVIEW != 'true' }}
        run: |
          set -euo pipefail

          unzip preview.zip
          rm preview.zip
          JAR_FILE=$(find . -maxdepth 1 -type f -name 'Slimefun vPreview Build*.jar' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "The preview artifact did not contain a Slimefun jar" >&2
            find . -maxdepth 1 -type f -print >&2
            exit 1
          fi

          unzip -t "$JAR_FILE" > /dev/null
          mv "$JAR_FILE" preview.jar

      - name: Check preview publish token
        if: ${{ env.SKIP_PREVIEW != 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "SKIP_PREVIEW=true" >> "$GITHUB_ENV"
            echo "::notice::PUBLISH_TOKEN is not configured; skipping external preview publish"
          fi

      - name: Upload to preview service
        if: ${{ env.SKIP_PREVIEW != 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          curl -X POST \
            --fail \
            --show-error \
            -H "Authorization: ${PUBLISH_TOKEN}" \
            -H "X-Checksum: $(sha256sum 'preview.jar' | awk '{print $1}')" \
            --data-binary '@preview.jar' \
            https://preview-builds.walshy.dev/upload/Slimefun/${{ env.PR_NUMBER }}/${{ env.COMMIT_HASH }}

      - name: Post comment
        if: ${{ env.SKIP_PREVIEW != 'true' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ env.PR_NUMBER }}
          message: |
            ### Slimefun preview build

            A Slimefun preview build is available for testing!
            Commit: ${{ env.COMMIT_HASH }}

            https://preview-builds.walshy.dev/download/Slimefun/${{ env.PR_NUMBER }}/${{ env.COMMIT_HASH }}

            > **Note**: This is not a supported build and is only here for the purposes of testing.
            > Do not run this on a live server and do not report bugs anywhere but this PR!
